<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gembokwarkop</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        textarea, input, button { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 10px; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #2c3e50; color: white; border: none; cursor: pointer; font-size: 16px; margin-right: 1%; width: 49%; display: inline-block; border-radius: 4px;}
        button:hover { background-color: #34495e; }
        .btn-group { display: flex; justify-content: space-between; margin-bottom: 10px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>Cipher Tool</h2>
    
    <label for="inputText">Input Text:</label>
    <textarea id="inputText" placeholder="Enter plaintext to encrypt, or ciphertext to decrypt..."></textarea>
    
    <label for="key">Vigenère Key (letters only):</label>
    <input type="text" id="key" placeholder="Enter your secret key (e.g., SECRET)">
    
    <div class="btn-group">
        <button onclick="processCipher(true)">Encrypt</button>
        <button onclick="processCipher(false)">Decrypt</button>
    </div>
    
    <label for="outputText">Output Text:</label>
    <textarea id="outputText" readonly></textarea>

    <script>
        function processCipher(isEncrypt) {
            const text = document.getElementById('inputText').value;
            const rawKey = document.getElementById('key').value.toUpperCase().replace(/[^A-Z]/g, '');
            const outputField = document.getElementById('outputText');

            if (!text || !rawKey) {
                outputField.value = 'Please provide both input text and a valid alphabetical key.';
                return;
            }

            try {
                if (isEncrypt) {
                    const base64Str = btoa(unescape(encodeURIComponent(text)));
                    outputField.value = applyVigenere(base64Str, rawKey, true);
                } else {
                    const vigenereDecoded = applyVigenere(text, rawKey, false);
                    outputField.value = decodeURIComponent(escape(atob(vigenereDecoded)));
                }
            } catch (e) {
                outputField.value = 'Error during processing. Ensure the input is valid ciphertext for decryption.';
            }
        }

        function applyVigenere(text, key, isEncrypt) {
            let result = '';
            let keyIndex = 0;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                if (/[a-zA-Z]/.test(char)) {
                    const isUpper = char === char.toUpperCase();
                    const base = isUpper ? 65 : 97;
                    const charCode = char.charCodeAt(0) - base;
                    const shift = key.charCodeAt(keyIndex % key.length) - 65;
                    
                    let newCharCode;
                    if (isEncrypt) {
                        newCharCode = (charCode + shift) % 26;
                    } else {
                        newCharCode = (charCode - shift + 26) % 26;
                    }
                    
                    result += String.fromCharCode(newCharCode + base);
                    keyIndex++;
                } else {
                    result += char;
                }
            }
            return result;
        }
    </script>
</body>
</html>
